services:
  db:
    container_name: wordpress-db
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_haslo_lab
      MARIADB_ROOT_PASSWORD: root_haslo
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    container_name: wordpress-app
    image: wordpress:php8.3-apache
    depends_on:
      - db
    ports:
      - "8080:80" 
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_haslo_lab
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        $$_SERVER['HTTP_HOST'] = '${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}';
        $$_SERVER['HTTPS'] = 'on';
        define('WP_HOME', 'https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}');
        define('WP_SITEURL', 'https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}');
    volumes:
      - ./wp-content:/var/www/html/wp-content

volumes:
  db_data: